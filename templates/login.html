<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | PlacementAI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
<div class="login-bg">
  <div class="login-container">
    <div class="glass-card p-5 login-card">
      <div class="text-center mb-4">
        <div class="login-icon mb-3"><i class="fas fa-lock"></i></div>
        <h3 class="gradient-text fw-bold">Admin Login</h3>
        <p class="text-muted small">Placement Prediction System</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-user text-muted"></i></span>
            <input type="text" name="username" class="form-control border-start-0" placeholder="admin" required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-key text-muted"></i></span>
            <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required id="pwdInput">
            <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePwd()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg glow-btn">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </button>
        </div>
      </form>
      <div class="text-center mt-4">
        <span class="badge bg-secondary px-3 py-2">Default: admin / admin123</span>
      </div>
      <div class="text-center mt-3">
        <a href="/" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Home</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script>
function togglePwd() {
  const inp = document.getElementById('pwdInput');
  const ico = document.getElementById('eyeIcon');
  if (inp.type === 'password') { inp.type = 'text'; ico.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; ico.className = 'fas fa-eye'; }
}
</script>
</body>
</html>
